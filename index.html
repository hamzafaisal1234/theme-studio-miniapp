        function processImage(input) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let img = new Image();
                    img.onload = function() {
                        let canvas = document.getElementById('canvas');
                        let ctx = canvas.getContext('2d');
                        canvas.width = 50; canvas.height = 50;
                        ctx.drawImage(img, 0, 0, 50, 50);
                        
                        let imgData = ctx.getImageData(0, 0, 50, 50).data;
                        let rSum = 0, gSum = 0, bSum = 0, total = 0;

                        for (let i = 0; i < imgData.length; i += 4) {
                            rSum += imgData[i];
                            gSum += imgData[i+1];
                            bSum += imgData[i+2];
                            total++;
                        }

                        let r = Math.round(rSum / total);
                        let g = Math.round(gSum / total);
                        let b = Math.round(bSum / total);

                        let dynamicColorInt = rgbToSignedInt(r, g, b);

                        // تحديث الخلفيات والعناصر الأساسية استناداً للقيم الحقيقية للثيم دون العبث بالهيكلة الثابتة
                        themeKeys["windowBackgroundWhite"] = rgbToSignedInt(Math.max(0, r-35), Math.max(0, g-35), Math.max(0, b-35));
                        themeKeys["dialogBackground"] = themeKeys["windowBackgroundWhite"];
                        themeKeys["actionBarDefault"] = dynamicColorInt;

                        renderOutput();
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function rgbToSignedInt(r, g, b) {
            let val = (255 << 24) | (r << 16) | (g << 8) | b;
            if (val > 0x7FFFFFFF) val -= 0x100000000;
            return val;
        }

        function getFileContent() {
            let lines = [];
            for (let key in themeKeys) {
                lines.push(`${key}=${themeKeys[key]}`);
            }
            return lines.join("\n");
        }

        function renderOutput() {
            document.getElementById('codeOutput').innerText = getFileContent();
        }

        function copyCode() {
            navigator.clipboard.writeText(getFileContent());
            alert("✅ تم نسخ مصفوفة الثيم الدقيقة بالكامل!");
        }

        function downloadFile() {
            let content = getFileContent();
            let blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "theme_accurate.attheme";
            document.body.appendChild(link);
            link.click();
            link.remove();
            alert("📥 تم تحميل ملف الثيم الدقيق بنجاح!");
        }

        window.onload = function() {
            renderOutput();
        };
