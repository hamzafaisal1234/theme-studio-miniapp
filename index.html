<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منسق الثيمات بالذكاء الاصطناعي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); padding: 20px; text-align: center; }
        .upload-btn { background: #2481cc; color: white; padding: 12px 20px; border-radius: 8px; cursor: pointer; display: inline-block; margin-bottom: 20px; }
        .palette-container { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .color-box { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #ccc; display: inline-block; }
        .controls { margin-top: 20px; text-align: right; background: rgba(0,0,0,0.05); padding: 15px; border-radius: 10px; }
        .control-group { margin-bottom: 10px; }
        input[type="color"] { border: none; width: 40px; height: 40px; cursor: pointer; background: none; }
    </style>
</head>
<body>

    <h2>🎨 صانع الثيمات الديناميكي</h2>
    <p>ارفع صورة لتنسيق ألوان الثيم تلقائياً</p>

    <label class="upload-btn">
        اختر صورة
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="uploadImage(this)">
    </label>

    <div id="result" style="display: none;">
        <h3>لوحة الألوان المستخرجة:</h3>
        <div class="palette-container" id="paletteBox"></div>

        <div class="controls">
            <h3>أدوات التحكم المخصصة:</h3>
            <div class="control-group">
                <label>اللون الأساسي: </label>
                <input type="color" id="primaryColorPicker" oninput="updateThemeLive()">
            </div>
            <div class="control-group">
                <label>لون الخلفية: </label>
                <input type="color" id="bgColorPicker" oninput="updateThemeLive()">
            </div>
        </div>
        
        <button onclick="saveTheme()" style="background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin-top: 15px; cursor: pointer;">تطبيق وتثبيت الثيم</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        async function uploadImage(input) {
            if (input.files && input.files[0]) {
                let formData = new FormData();
                formData.append("file", input.files[0]);

                let response = await fetch('https://YOUR_SERVER_URL/api/extract-theme', {
                    method: 'POST',
                    body: formData
                });
                let data = await response.json();

                // تعبئة البيانات في الواجهة
                document.getElementById('result').style.display = 'block';
                document.getElementById('primaryColorPicker').value = data.primary;
                document.getElementById('bgColorPicker').value = data.background;

                let paletteBox = document.getElementById('paletteBox');
                paletteBox.innerHTML = '';
                data.palette.forEach(hex => {
                    let span = document.createElement('span');
                    span.className = 'color-box';
                    span.style.backgroundColor = hex;
                    paletteBox.appendChild(span);
                });
            }
        }

        function updateThemeLive() {
            // معاينة حية لتغيير الألوان
            let primary = document.getElementById('primaryColorPicker').value;
            let bg = document.getElementById('bgColorPicker').value;
            document.body.style.backgroundColor = bg;
        }

        function saveTheme() {
            let themeData = {
                primary: document.getElementById('primaryColorPicker').value,
                background: document.getElementById('bgColorPicker').value
            };
            tg.sendData(JSON.stringify(themeData)); // إرسال الثيم إلى البوت في تيليجرام
            tg.close();
        }
    </script>
</body>
</html>
