<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة ثيمات تيليجرام الاحترافية</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #dbeafe;
            color: #1e293b;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { font-size: 16px; margin: 5px 0 10px; color: #1e3a8a; text-align: center; }

        .upload-card {
            background: #ffffff;
            border: 2px dashed #3b82f6;
            padding: 10px 15px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
        }

        /* حاوية الهواتف المجاورة للمعاينة (تطابق صورة البوت) */
        .phones-wrapper {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 12px;
            width: 100%;
            max-width: 420px;
        }

        /* تصميم هيكل الهاتف */
        .phone-mockup {
            width: 180px;
            height: 340px;
            border-radius: 24px;
            padding: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            position: relative;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            border: 3px solid #0f172a;
        }

        /* شاشة المحادثة (الهاتف الأيمن) */
        #chatPhone {
            background-size: cover;
            background-position: center;
        }

        .mock-header {
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            margin-bottom: 8px;
        }
        .mock-bar-pill {
            height: 6px;
            border-radius: 3px;
            width: 45px;
        }
        .mock-dot {
            width: 8px; height: 8px; border-radius: 50%;
        }

        /* فقرات الرسائل في المعاينة */
        .mock-chat-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
            padding: 4px;
        }
        .mock-bubble {
            border-radius: 10px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 85%;
        }
        .mock-bubble.in { align-self: flex-start; border-bottom-left-radius: 2px; }
        .mock-bubble.out { align-self: flex-end; border-bottom-right-radius: 2px; }
        
        .line-short { height: 5px; border-radius: 3px; width: 60%; }
        .line-long { height: 5px; border-radius: 3px; width: 90%; }

        /* شاشة القائمة الرئيسية (الهاتف الأيسر) */
        .mock-chats-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 4px;
            overflow: hidden;
        }
        .chat-row-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-avatar-circle {
            width: 24px; height: 24px; border-radius: 50%;
            flex-shrink: 0;
        }
        .chat-text-lines {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* أدوات التحكم وتوليد الثيم */
        .controls-box {
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
        }
        input[type="color"] { border: none; width: 28px; height: 28px; cursor: pointer; background: none; border-radius: 50%; }

        .code-box {
            background: #090d16;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px;
            font-family: monospace;
            font-size: 10px;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            margin-bottom: 10px;
            max-height: 100px;
            overflow-y: auto;
            color: #38bdf8;
        }

        .btn-group { display: flex; gap: 8px; flex-direction: column; width: 100%; max-width: 380px; }
        .action-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .action-btn.success { background: #16a34a; }
    </style>
</head>
<body>

    <h2> معاينة الثيم المطابقة تماماً لـ ThemePreviewBot</h2>

    <label class="upload-card">
        📁 اختر صورة الطاحونة أو خلفية الثيم
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="processImage(this)">
    </label>

    <!-- الهواتف المجاورة تماماً لصورة البوت -->
    <div class="phones-wrapper">
        
        <!-- الهاتف الأيمن: شاشة المحادثة مع الخلفية -->
        <div class="phone-mockup" id="chatPhone">
            <div class="mock-header">
                <div class="mock-dot" id="cDot1"></div>
                <div class="mock-bar-pill" id="cBarPill"></div>
                <div class="mock-dot" id="cDot2"></div>
            </div>
            <div class="mock-chat-content">
                <div class="mock-bubble in" id="mIn1">
                    <div class="line-short" id="lIn1"></div>
                    <div class="line-long" id="lIn2"></div>
                </div>
                <div class="mock-bubble out" id="mOut1">
                    <div class="line-long" id="lOut1"></div>
                </div>
                <div class="mock-bubble in" id="mIn2">
                    <div class="line-short" id="lIn3"></div>
                </div>
                <div class="mock-bubble out" id="mOut2">
                    <div class="line-long" id="lOut2"></div>
                </div>
            </div>
        </div>

        <!-- الهاتف الأيسر: الشاشة الرئيسية (القوائم) -->
        <div class="phone-mockup" id="chatsPhone">
            <div class="mock-header">
                <div class="mock-dot" id="sDot1"></div>
                <div class="mock-bar-pill" id="sBarPill"></div>
                <div class="mock-dot" id="sDot2"></div>
            </div>
            <div class="mock-chats-content" id="chatsContainerBg">
                <!-- صف محادثة وهمي 1 -->
                <div class="chat-row-item">
                    <div class="chat-avatar-circle" id="av1"></div>
                    <div class="chat-text-lines">
                        <div class="line-short" id="txt1"></div>
                        <div class="line-long" id="txt2"></div>
                    </div>
                </div>
                <!-- صف محادثة وهمي 2 -->
                <div class="chat-row-item">
                    <div class="chat-avatar-circle" id="av2"></div>
                    <div class="chat-text-lines">
                        <div class="line-short" id="txt3"></div>
                        <div class="line-long" id="txt4"></div>
                    </div>
                </div>
                <!-- صف محادثة وهمي 3 -->
                <div class="chat-row-item">
                    <div class="chat-avatar-circle" id="av3"></div>
                    <div class="chat-text-lines">
                        <div class="line-short" id="txt5"></div>
                        <div class="line-long" id="txt6"></div>
                    </div>
                </div>
                <!-- صف محادثة وهمي 4 -->
                <div class="chat-row-item">
                    <div class="chat-avatar-circle" id="av4"></div>
                    <div class="chat-text-lines">
                        <div class="line-short" id="txt7"></div>
                        <div class="line-long" id="txt8"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="controls-box">
        <div class="control-row">
            <span>شريط العنوان (actionBarDefault):</span>
            <input type="color" id="pHeader" value="#101921" oninput="updateLiveTheme()">
        </div>
        <div class="control-row">
            <span>خلفية القوائم (windowBackgroundWhite):</span>
            <input type="color" id="pChatBg" value="#0b1017" oninput="updateLiveTheme()">
        </div>
        <div class="control-row">
            <span>رسائل الصادر (chat_outBubble):</span>
            <input type="color" id="pOutBubble" value="#2b5278" oninput="updateLiveTheme()">
        </div>
        <div class="control-row">
            <span>رسائل الوارد (chat_inBubble):</span>
            <input type="color" id="pInBubble" value="#18222d" oninput="updateLiveTheme()">
        </div>
        <div class="control-row">
            <span>ألوان الخطوط والأيقونات (Text):</span>
            <input type="color" id="pText" value="#38bdf8" oninput="updateLiveTheme()">
        </div>

        <div style="font-size: 12px; margin: 8px 0 4px; font-weight: bold; color: #1e3a8a;">كود الثيم الناتج (.attheme):</div>
        <div class="code-box" id="codeOutput">اختر صورة لتوليد كود الثيم بدقة...</div>
    </div>

    <div class="btn-group">
        <button class="action-btn" onclick="copyThemeText()">📋 نسخ أكواد الثيم</button>
        <button class="action-btn success" onclick="downloadThemeFile()">📥 تحميل ملف theme_new.attheme</button>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let currentBgImage = "";

        function processImage(input) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    currentBgImage = e.target.result;
                    document.getElementById('chatPhone').style.backgroundImage = `url(${currentBgImage})`;

                    let img = new Image();
                    img.onload = function() {
                        let canvas = document.getElementById('canvas');
                        let ctx = canvas.getContext('2d');
                        canvas.width = 60; canvas.height = 60;
                        ctx.drawImage(img, 0, 0, 60, 60);
                        
                        let imgData = ctx.getImageData(0, 0, 60, 60).data;
                        let rSum = 0, gSum = 0, bSum = 0, total = 0;

                        for (let i = 0; i < imgData.length; i += 4) {
                            rSum += imgData[i];
                            gSum += imgData[i+1];
                            bSum += imgData[i+2];
                            total++;
                        }

                        let r = Math.round(rSum / total);
                        let g = Math.round(gSum / total);
                        let b = Math.round(bSum / total);

                        let chatBgHex = rgbToHex(Math.max(0, r - 50), Math.max(0, g - 50), Math.max(0, b - 50));
                        let headerHex = rgbToHex(Math.max(0, r - 30), Math.max(0, g - 30), Math.max(0, b - 30));
                        let outBubbleHex = rgbToHex(r, g, b);
                        let inBubbleHex = rgbToHex(Math.min(255, r + 20), Math.min(255, g + 20), Math.min(255, b + 20));

                        document.getElementById('pHeader').value = headerHex;
                        document.getElementById('pChatBg').value = chatBgHex;
                        document.getElementById('pOutBubble').value = outBubbleHex;
                        document.getElementById('pInBubble').value = inBubbleHex;

                        updateLiveTheme();
                    }
                    img.src = currentBgImage;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        function hexToTelegramSignedInt(hex) {
            let c = hex.replace('#', '');
            let red = parseInt(c.substring(0, 2), 16);
            let green = parseInt(c.substring(2, 4), 16);
            let blue = parseInt(c.substring(4, 6), 16);
            let val = (255 << 24) | (red << 16) | (green << 8) | blue;
            if (val > 0x7FFFFFFF) val -= 0x100000000;
            return val;
        }

        function generateThemeContent() {
            let header = hexToTelegramSignedInt(document.getElementById('pHeader').value);
            let chatBg = hexToTelegramSignedInt(document.getElementById('pChatBg').value);
            let outBubble = hexToTelegramSignedInt(document.getElementById('pOutBubble').value);
            let inBubble = hexToTelegramSignedInt(document.getElementById('pInBubble').value);
            let textColor = hexToTelegramSignedInt(document.getElementById('pText').value);

            let keys = [
                `actionBarDefault=${header}`,
                `actionBarDefaultIcon=${textColor}`,
                `actionBarDefaultTitle=${textColor}`,
                `windowBackgroundWhite=${chatBg}`,
                `windowBackgroundGray=${chatBg}`,
                `dialogBackground=${chatBg}`,
                `chat_background=${chatBg}`,
                `chat_inBubble=${inBubble}`,
                `chat_outBubble=${outBubble}`,
                `chat_messageTextIn=${textColor}`,
                `chat_messageTextOut=${textColor}`,
                `chat_messagePanelBackground=${header}`,
                `chat_messagePanelText=${textColor}`,
                `chats_actionBackground=${outBubble}`,
                `chats_name=${textColor}`,
                `chats_message=${textColor}`,
                `chats_date=${textColor}`
            ];

            return keys.join("\n");
        }

        function updateLiveTheme() {
            let header = document.getElementById('pHeader').value;
            let chatBg = document.getElementById('pChatBg').value;
            let outBubble = document.getElementById('pOutBubble').value;
            let inBubble = document.getElementById('pInBubble').value;
            let textColor = document.getElementById('pText').value;

            // تحديث الهاتف الأيمن (المحادثة)
            document.getElementById('cBarPill').style.backgroundColor = header;
            document.getElementById('cDot1').style.backgroundColor = textColor;
            document.getElementById('cDot2').style.backgroundColor = textColor;
            document.getElementById('mIn1').style.backgroundColor = inBubble;
            document.getElementById('mIn2').style.backgroundColor = inBubble;
            document.getElementById('mOut1').style.backgroundColor = outBubble;
            document.getElementById('mOut2').style.backgroundColor = outBubble;

            document.getElementById('lIn1').style.backgroundColor = textColor;
            document.getElementById('lIn2').style.backgroundColor = textColor;
            document.getElementById('lIn3').style.backgroundColor = textColor;
            document.getElementById('lOut1').style.backgroundColor = textColor;
            document.getElementById('lOut2').style.backgroundColor = textColor;

            // تحديث الهاتف الأيسر (القائمة الرئيسية)
            document.getElementById('chatsPhone').style.backgroundColor = chatBg;
            document.getElementById('sBarPill').style.backgroundColor = header;
            document.getElementById('sDot1').style.backgroundColor = textColor;
            document.getElementById('sDot2').style.backgroundColor = textColor;

            let avatars = document.querySelectorAll('.chat-avatar-circle');
            avatars.forEach(av => av.style.backgroundColor = outBubble);

            let textLines = document.querySelectorAll('.chat-text-lines div');
            textLines.forEach(line => line.style.backgroundColor = textColor);

            document.getElementById('codeOutput').innerText = generateThemeContent();
        }

        function copyThemeText() {
            navigator.clipboard.writeText(generateThemeContent());
            alert("✅ تم نسخ أكواد الثيم بنجاح!");
        }

        function downloadThemeFile() {
            let content = generateThemeContent();
            let blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "theme_new.attheme";
            document.body.appendChild(link);
            link.click();
            link.remove();
            alert("📥 تم تحميل ملف 'theme_new.attheme' بنجاح!");
        }

        window.onload = function() {
            updateLiveTheme();
        };
    </script>
</body>
</html>
